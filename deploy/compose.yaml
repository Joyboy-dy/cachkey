# Cachkey — self-hosted deployment, from the published images (amd64 and arm64).
#
#   cp .env.production.example .env.prod   # then fill in the secrets
#   docker compose -f deploy/compose.yaml --env-file .env.prod up -d   # from the repo root
#
# This file is also the reference for platform templates (deploy/templates/). It needs no
# file from the repository: it can be copied on its own next to an env file.
#
# Only the web app is published on the host, bound to 127.0.0.1: put a TLS reverse proxy
# (Caddy, Traefik, nginx…) in front of it. The API and PostgreSQL stay on the internal
# network. To build the images from source instead: add `-f deploy/compose.build.yaml`.
name: cachkey

x-app-environment: &app-environment
  APP_URL: ${APP_URL:?Set APP_URL to the public address, e.g. https://cachkey.example.com}
  DATABASE_URL: postgresql://cachkey:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/cachkey
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (openssl rand -base64 32)}
  # Required to confirm addresses and send invitations: smtp + SMTP_*, or resend.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:-Cachkey <no-reply@cachkey.local>}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cachkey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cachkey
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachkey -d cachkey"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies pending database migrations at startup, then serves /api (healthcheck built in).
  api:
    image: ghcr.io/joyboy-dy/cachkey-api:${CACHKEY_VERSION:-0.2.0}
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/joyboy-dy/cachkey-web:${CACHKEY_VERSION:-0.2.0}
    restart: unless-stopped
    environment:
      # Public address: enables HSTS once served over HTTPS.
      APP_URL: ${APP_URL:?Set APP_URL to the public address, e.g. https://cachkey.example.com}
      API_INTERNAL_URL: http://api:3001
    ports:
      # Bound to localhost: the reverse proxy reaches it, the outside world does not.
      - "${CACHKEY_BIND:-127.0.0.1}:${CACHKEY_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
