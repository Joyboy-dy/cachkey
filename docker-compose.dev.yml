# Local development services only (PostgreSQL + Mailpit).
# Usage: bun run services:up
name: cachkey-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cachkey
      POSTGRES_PASSWORD: cachkey
      POSTGRES_DB: cachkey
    ports:
      - "127.0.0.1:${CACHKEY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachkey -d cachkey"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CACHKEY_SMTP_PORT:-1026}:1025" # SMTP
      - "127.0.0.1:${CACHKEY_MAILPIT_UI_PORT:-8026}:8025" # Web UI → http://localhost:8026

volumes:
  postgres-data:
