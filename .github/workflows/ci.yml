# Checks every pull request and every push: format, lint, types, tests, UI contracts, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, types, tests, UI contracts
        run: bun run check

      - name: Build
        run: bun run build

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Throwaway local configuration: example values plus a fresh encryption key.
      - name: Configure the stack
        run: |
          cp .env.example .env.local
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env.local
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env.local

      - name: Start PostgreSQL and Mailpit
        run: docker compose -f deploy/compose.dev.yaml up -d --wait

      - name: Apply migrations
        run: bun run db:deploy

      - name: Start web and API
        run: |
          nohup bun run dev > dev.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://localhost:3000/sign-in > /dev/null; do sleep 2; done'

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run the journeys
        run: bun run e2e

      - name: Keep the report and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            dev.log
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Builds without publishing: a broken Dockerfile fails the pull request.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
